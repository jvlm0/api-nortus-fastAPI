# Configuração temporária para obter certificados
# Use esta configuração APENAS durante a obtenção inicial dos certificados

server {
    listen 80;
    server_name apinortus.duckdns.org;
    
    # IMPORTANTE: Permite validação do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redireciona resto para HTTPS (após obter certificados, descomente)
    # location / {
    #     return 301 https://$host$request_uri;
    # }
    
    # Temporariamente permite acesso HTTP para testes
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}