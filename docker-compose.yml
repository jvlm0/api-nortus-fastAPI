services:
  firebird:
    image: jacobalberty/firebird:2.5-ss
    container_name: firebird_db
    restart: always
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: APPUSERS.FDB
      FIREBIRD_USER: SYSDBA
    volumes:
      - ./firebird_data:/firebird/data
    ports:
      - "3050:3050"
    networks:
      - app_network

  api:
    build: .
    container_name: fastapi_app
    restart: always
    depends_on:
      - firebird
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network


networks:
  app_network:
    driver: bridge